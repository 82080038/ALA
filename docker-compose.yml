# ╔════════════════════════════════════════════════════════════════════╗
# ║  KOMPATIBILITAS LINTAS-PLATFORM (Windows + Linux + macOS)         ║
# ║                                                                    ║
# ║  • extra_hosts: Windows/macOS Docker Desktop menyediakan           ║
# ║    host.docker.internal secara native. Di Linux, mapping           ║
# ║    eksplisit host-gateway diperlukan (sudah dikonfigurasi).        ║
# ║  • Volume: Menggunakan named volumes (BUKAN bind-mount host)      ║
# ║    untuk PostgreSQL, ChromaDB, Neo4j — mencegah bug EACCES/       ║
# ║    Permission Denied saat transisi antara Linux rootless Docker    ║
# ║    dan Windows WSL2.                                               ║
# ║  • OLLAMA_BASE_URL: Default ke host.docker.internal:11434.        ║
# ║    Dapat di-override via .env untuk setup native Linux.            ║
# ╚════════════════════════════════════════════════════════════════════╝

services:
  # ── FastAPI Back-End (Python 3.11+) ──────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ala-api
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      neo4j:
        condition: service_healthy
    # Lintas-platform: Windows/macOS sudah punya host.docker.internal.
    # Linux memerlukan mapping eksplisit di bawah ini.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      # Runtime memakai role non-superuser agar RLS tenant ditegakkan.
      # DATABASE_ADMIN_URL (ala_user) hanya dipakai scripts/init_db.py.
      - DATABASE_URL=postgresql://ala_app:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/ala_db
      - DATABASE_ADMIN_URL=postgresql://ala_user:${POSTGRES_PASSWORD}@postgres:5432/ala_db
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Lintas-platform: host.docker.internal bekerja di semua OS.
      # Override via .env jika Ollama berjalan di alamat berbeda.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Dual-instance GPU pinning: reasoning → GPU 0 (:11434), coder → GPU 1 (:11435)
      - OLLAMA_REASONING_URL=${OLLAMA_REASONING_URL:-http://host.docker.internal:11434}
      - OLLAMA_CODER_URL=${OLLAMA_CODER_URL:-http://host.docker.internal:11435}
      - OLLAMA_MODEL_REASONING=${OLLAMA_MODEL_REASONING:-qwen2.5:3b-instruct}
      - OLLAMA_MODEL_CODER=${OLLAMA_MODEL_CODER:-qwen2.5-coder:3b}
    volumes:
      - ./backend:/app
      # Socket Docker — agar api dapat menjalankan kode AI di sandbox
      # sibling container (ala-sandbox:latest, network_mode: none)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ala-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Front-End (TypeScript) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ala-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - ala-network
    restart: unless-stopped

  # ── PostgreSQL 15 (Transactional / Audit) ────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ala-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ala_db
      POSTGRES_USER: ala_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ala-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ala_user -d ala_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB (Vector Search / RAG) ──────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: ala-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - ala-network
    restart: unless-stopped

  # ── Neo4j 5 (Graph / Ontology) ──────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: ala-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks:
      - ala-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: ala_postgres_data
  chroma_data:
    name: ala_chroma_data
  neo4j_data:
    name: ala_neo4j_data

networks:
  ala-network:
    name: ala-network
    driver: bridge
